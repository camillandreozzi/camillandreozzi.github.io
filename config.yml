baseURL: "https://camillandreozzi.github.io/"
title: Camilla Andreozzi
theme: PaperMod

enableInlineShortcodes: true
enableRobotsTXT: true
pagination:
  pagerSize: 20

taxonomies:
    tag: tags

menu:
    main:
        - name: Papers
          url: papers/
          weight: 1
        - name: Books
          url: books/
          weight: 2
        - name: Blog
          url: blog/
          weight: 3
        # Uncomment once static/cv.pdf is added:
        # - name: CV
        #   url: cv.pdf
        #   weight: 4

params:
    description: "Camilla Andreozzi's personal website: research papers, reading list, and blog."
    author: Camilla Andreozzi
    # googleAnalyticsID: G-XXXXX
    DateFormat: January 2006
    defaultTheme: light
    hideFooter: false
    disableThemeToggle: true
    ShowShareButtons: false
    ShowReadingTime: false
    disableSpecial1stPost: true
    disableAnchoredHeadings: true
    ShowPostNavLinks: false
    ShowBreadCrumbs: false
    ShowCodeCopyButtons: true
    ShowAllPagesInArchive: false
    MainSections: [papers, blog]
    ShowToc: false
    disableScrollToTop: true
    TocOpen: true
    ShowWordCount: false
    UseHugoToc: true
    comments: false
    math: true
    profileMode:
          enabled: true
          title: Camilla Andreozzi
          subtitle: "I am a Professor in the Institute of Romance Philology at the University of Regensburg, Germany. My research focuses on Portuguese irregular verbs. I was a doctoral student of Professor Dr Dieter Vogelsang in Munich, and later a second assistant of Professor Walter Schoeffler-Henschell at the University of Wiesbaden."
          imageUrl: camilla.jpeg
          imageWidth: 160
          imageHeight: 160
          buttons:
            - name: Papers
              url: papers/
            - name: Books
              url: books/
            - name: Blog
              url: blog/
            # Uncomment once static/cv.pdf is added:
            # - name: CV
            #   url: cv.pdf

    socialIcons:
        # Uncomment once static/cv.pdf is added:
        # - name: CV
        #   url: cv.pdf
        - name: Email
          url: mailto:andreozzicamilla@gmail.com
        - name: GitHub
          url: https://github.com/camillandreozzi
          
    assets:
        disableScrollBarStyle: true
    cover:
        hiddenInList: false
        hiddenInSingle: true
    label:
      text: Camilla Andreozzi
      icon: favicon.ico
      iconHeight: 18

markup:
    goldmark:
        renderer:
            unsafe: true
    highlight:
        guessSyntax: true
        style: autumn 
    tableOfContents:
        endLevel: 2
        ordered: false
        startLevel: 2
