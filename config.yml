baseURL: "https://camillandreozzi.github.io/"
title: Camilla Andreozzi
theme: PaperMod

enableInlineShortcodes: true
enableRobotsTXT: true
pagination:
  pagerSize: 20

taxonomies:
    tag: tags

menu:
    main:
        - name: Papers
          url: papers/
          weight: 1
        - name: Books
          url: books/
          weight: 2
        - name: Blog
          url: blog/
          weight: 3
        - name: CV
          url: cv.pdf
          weight: 4

params:
    description: "Camilla Andreozzi's personal website: research papers, reading list, and blog."
    author: Camilla Andreozzi
    # googleAnalyticsID: G-XXXXX
    DateFormat: January 2006
    defaultTheme: light
    hideFooter: false
    disableThemeToggle: true
    ShowShareButtons: false
    ShowReadingTime: false
    disableSpecial1stPost: true
    disableAnchoredHeadings: true
    ShowPostNavLinks: false
    ShowBreadCrumbs: false
    ShowCodeCopyButtons: true
    ShowAllPagesInArchive: false
    MainSections: [papers, blog]
    ShowToc: false
    disableScrollToTop: true
    TocOpen: true
    ShowWordCount: false
    UseHugoToc: true
    comments: false
    math: true
    profileMode:
          enabled: true
          title: Camilla Andreozzi
          subtitle: "I am an MSc student in Statistics at ETH Zürich and a Research Intern at the World Radiation Center in Davos, where I work on reconstructing gaps in satellite climate observations. My research focuses on statistical methods for environmental and humanitarian data, including multi-fidelity Gaussian processes, robust data fusion, and LLM-based information extraction. Before ETH, I completed a double degree in Statistics at the University of Glasgow and the University of Bologna, and worked with the UN Office for Disaster Risk Reduction and Public Health Scotland."
          imageUrl: camilla.jpeg
          imageWidth: 160
          imageHeight: 160
          buttons:
            - name: Papers
              url: papers/
            - name: Books
              url: books/
            - name: Blog
              url: blog/
            - name: CV
              url: cv.pdf

    socialIcons:
        - name: CV
          url: cv.pdf
        - name: Email
          url: mailto:andreozzicamilla@gmail.com
        - name: GitHub
          url: https://github.com/camillandreozzi
          
    assets:
        disableScrollBarStyle: true
    cover:
        hiddenInList: false
        hiddenInSingle: true
    label:
      text: Camilla Andreozzi
      icon: favicon.ico
      iconHeight: 18

markup:
    goldmark:
        renderer:
            unsafe: true
    highlight:
        guessSyntax: true
        style: autumn 
    tableOfContents:
        endLevel: 2
        ordered: false
        startLevel: 2
